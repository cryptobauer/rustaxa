[workspace]
members = [
    "crates/rustaxa-native-config",
    "crates/rustaxa-bridge",
    "crates/rustaxa-consensus",
    "crates/rustaxa-evm",
    "crates/rustaxa-execution",
    "crates/rustaxa-storage",
    "crates/rustaxa-types",
    "crates/rustaxa-vdf",
]
exclude = ["vendor/rocksdb"]
resolver = "3"

[patch.crates-io]
rocksdb = { path = "vendor/rocksdb" }
