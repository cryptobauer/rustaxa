[package]
name = "rustaxa-evm"
version = "0.1.0"
edition = "2024"
publish = false

[features]
synthetic-fixtures = []

[dependencies]
rlp = "0.6"
anyhow = "1.0.100"
rustaxa-types = { path = "../rustaxa-types" }
num-bigint = "0.4.6"
fn-dsa-vrfy = "=0.3.0"
revm = { git = "https://github.com/bluealloy/revm.git", rev = "6014612c86f3690e4e9173a8c4deade396af398d", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = "1.1"
hex = "0.4"
ethereum-types = { version = "0.16.0", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rustaxa-consensus = { path = "../rustaxa-consensus", features = ["synthetic-fixtures"] }
rustaxa-storage = { path = "../rustaxa-storage", features = ["synthetic-fixtures"] }
serde_json = "1.0.145"
rocksdb = { version = "0.24.0", default-features = false, features = ["lz4"] }
