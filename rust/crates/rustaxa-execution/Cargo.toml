[package]
name = "rustaxa-execution"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustaxa-native-config = { path = "../rustaxa-native-config" }
ethereum-types = { version = "0.16.0", features = ["rlp"] }
anyhow = "1.0.100"
num-bigint = "0.4.6"
rlp = "0.6"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
rustaxa-consensus = { path = "../rustaxa-consensus" }
rustaxa-evm = { path = "../rustaxa-evm" }
rustaxa-storage = { path = "../rustaxa-storage" }
rustaxa-types = { path = "../rustaxa-types" }

[dev-dependencies]
rustaxa-consensus = { path = "../rustaxa-consensus", features = ["synthetic-fixtures"] }
rustaxa-storage = { path = "../rustaxa-storage", features = ["synthetic-fixtures"] }
hex = "0.4"
rocksdb = { version = "0.24.0", default-features = false, features = ["lz4"] }
ethereum-types = { version = "0.16.0", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
revm = { git = "https://github.com/bluealloy/revm.git", rev = "6014612c86f3690e4e9173a8c4deade396af398d", default-features = false, features = ["std"] }
serde_json = "1.0.145"

[features]
production_integration_test = ["rustaxa-consensus/production_integration_test"]
