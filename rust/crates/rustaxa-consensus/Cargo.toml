[package]
name = "rustaxa-consensus"
version = "0.1.0"
edition = "2024"

[features]
production_integration_test = ["rustaxa-storage/production_integration_test"]
synthetic-fixtures = ["rustaxa-storage/synthetic-fixtures"]

[dependencies]
rustaxa-native-config = { path = "../rustaxa-native-config" }
anyhow = "1.0.100"
ethereum-types = { version = "0.16.0", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
keccak-hasher = "0.15.3"
rlp = "0.6"
rustaxa-storage = { version = "0.1.0", path = "../rustaxa-storage" }
rustaxa-types = { version = "0.1.0", path = "../rustaxa-types" }
rustaxa-vdf = { version = "0.1.0", path = "../rustaxa-vdf" }
serde_json = "1.0.145"
num-bigint = "0.4.6"
rand = "0.9"
tiny-keccak = { version = "2.0", features = ["keccak"] }
triehash = "0.8.4"

[dev-dependencies]
tempfile = "3"
flate2 = "1.1"
rocksdb = { version = "0.24.0", default-features = false, features = ["lz4"] }
