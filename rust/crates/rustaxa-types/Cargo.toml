[package]
name = "rustaxa-types"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
ethereum-types = { version = "0.16.0", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
