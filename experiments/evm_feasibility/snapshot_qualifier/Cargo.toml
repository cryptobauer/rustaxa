[package]
name = "rustaxa-snapshot-qualifier"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ethereum-types = { version = "0.16", features = ["rlp"] }
hex = "0.4"
rlp = "0.6"
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
